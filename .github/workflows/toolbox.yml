name: toolbox
on:
  push:
    tags: ['v*']
  # Build only (no push, no signing): a Dockerfile change that breaks the build
  # must show up in the PR, not on the next release.
  pull_request:
    paths:
      - 'toolbox/**'
      - '.github/workflows/toolbox.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's build is superseded by the next push to it. A tag, the
# weekly rebuild and a dispatch are never cancelled: they push and sign.
concurrency:
  group: toolbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/raphaelbleier/mythos-toolbox

jobs:
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: toolbox/Dockerfile
          platforms: linux/amd64
          push: false
          # Read-only: a PR must not write into the cache that release builds read.
          cache-from: type=gha,scope=amd64

  # The weekly rebuild publishes without a human looking at it, so the candidate
  # image has to pass the self-test first. Built here, loaded into the local daemon
  # and tested via MYTHOS_IMAGE; a failure blocks `build` and therefore the push.
  selftest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: toolbox/Dockerfile
          platforms: linux/amd64
          load: true
          tags: mythos-toolbox:candidate
          cache-from: type=gha,scope=amd64
      # The lab target gives the candidate image something real to reach: the
      # loopback check runs curl inside the container over MYTHOS_NET=host.
      - name: start the lab target
        run: |
          docker compose -f lab/docker-compose.yml up -d vulnapp
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/)" = "200" ] && exit 0
            sleep 2
          done
          echo "lab target never answered on 127.0.0.1:5001" >&2
          exit 1
      - name: self-test the candidate image
        env:
          MYTHOS_IMAGE: mythos-toolbox:candidate
        run: scripts/selftest.sh --with-docker

  build:
    # Runs for tags and dispatch (selftest skipped) and for the schedule once the
    # self-test passed; !failure() lets a skipped selftest through.
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' }}
    needs: selftest
    strategy:
      fail-fast: false   # an amd64 failure must not cancel the arm64 build
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, pair: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, pair: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write   # push the per-arch image by digest to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Kali image plus the Go toolchain overrun a stock runner's ~14 GB of
      # free disk. Reclaim the preinstalled SDKs we never use.
      - name: free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: toolbox/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pair }}
          provenance: mode=max
          sbom: true
      - name: export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push the merged manifest list tags to GHCR
      id-token: write   # keyless cosign signing via the workflow's OIDC identity
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,prefix=sha-
      - name: merge manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign (keyless)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "${IMAGE}@${DIGEST}"
          # scripts/mythos pins this digest; a release updates toolbox/IMAGE_DIGEST with it.
          echo "toolbox/IMAGE_DIGEST: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
