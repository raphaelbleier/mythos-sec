name: toolbox
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/raphaelbleier/mythos-toolbox

jobs:
  build:
    strategy:
      fail-fast: false   # an amd64 failure must not cancel the arm64 build
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, pair: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, pair: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The Kali image plus the Go toolchain overrun a stock runner's ~14 GB of
      # free disk. Reclaim the preinstalled SDKs we never use.
      - name: free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: toolbox/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pair }}
          provenance: mode=max
          sbom: true
      - name: export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,prefix=sha-
      - name: merge manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - uses: sigstore/cosign-installer@v3
      - name: sign (keyless)
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "${IMAGE}@${DIGEST}"
