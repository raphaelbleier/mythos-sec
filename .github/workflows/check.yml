name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'   # cli/package.json: engines.node >= 20
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # scripts/probe, verify, coverage and mythos have no .py suffix, so a
      # suffix-based glob never syntax-checks them. Select by shebang as well.
      - name: Python files compile
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bad = 0
          for f in subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.splitlines():
              try:
                  src = open(f, "rb").read()
              except OSError:
                  continue
              first = src.split(b"\n", 1)[0]
              if not (f.endswith(".py") or (first.startswith(b"#!") and b"python" in first)):
                  continue
              try:
                  compile(src, f, "exec")
              except SyntaxError as e:
                  print(f"{f}: {e}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: Shell scripts parse
        run: git ls-files '*.sh' | xargs -r -n1 bash -n

      - name: Install the CLI's dependencies
        run: npm ci --prefix cli

      - name: CLI typecheck
        run: npm run check --prefix cli

      - name: CLI build
        run: npm run build --prefix cli

      - name: CLI selftest
        run: node cli/dist/selftest.js

      # Listed here as well as inside scripts/selftest.sh, so a failure names the
      # script in the job log instead of only the wrapper.
      - name: Script and guard selftests
        run: |
          for s in scripts/probe scripts/verify scripts/coverage scripts/findings scripts/cvefeed \
                   scripts/sourcemap scripts/traffic scripts/watch scripts/lessons \
                   scripts/lessons-record scripts/models \
                   hooks/scope-guard.py hooks/budget-guard.py; do
            echo "== $s"
            python3 "$s" --selftest
          done

      # Again with PyYAML hidden. The scope guard parses a scope file with
      # PyYAML when it is installed and with its own reader when it is not, and
      # the two disagreed: the fallback read `ports: [80, 443]` as one opaque
      # string and enforced no port restriction at all. That shipped for months
      # because every machine that ran the tests had PyYAML.
      - name: Guard selftests without PyYAML
        run: |
          mkdir -p /tmp/noyaml
          printf 'raise ImportError("blocked for this check")\n' > /tmp/noyaml/yaml.py
          for s in hooks/scope-guard.py hooks/budget-guard.py scripts/traffic scripts/watch; do
            echo "== $s (no PyYAML)"
            PYTHONPATH=/tmp/noyaml python3 "$s" --selftest
          done

      # The same selftests again, plus the guard behaviour end to end. Docker is
      # not available here, so the toolbox checks are skipped.
      - name: Repository selftest
        run: scripts/selftest.sh

      - name: Install YAML parser (hash-pinned)
        run: pip install --require-hashes -r .github/ci-requirements.txt

      - name: Skill frontmatter is valid
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          import yaml

          errors = []

          def front(p):
              m = re.match(r"---\r?\n(.*?)\r?\n---[ \t]*(\r?\n|$)", p.read_text(encoding="utf-8"), re.S)
              if not m:
                  raise ValueError("no YAML frontmatter")
              d = yaml.safe_load(m.group(1))
              if not isinstance(d, dict):
                  raise ValueError("frontmatter is not a mapping")
              return d

          skills = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          if not skills:
              errors.append("skills/: no SKILL.md found")
          for p in skills:
              try:
                  d = front(p)
              except Exception as e:
                  errors.append(f"{p}: {e}")
                  continue
              if d.get("name") != p.parent.name:
                  errors.append(f"{p}: name {d.get('name')!r} != directory {p.parent.name!r}")
              if not (isinstance(d.get("description"), str) and d["description"].strip()):
                  errors.append(f"{p}: missing description")

          print("\n".join(errors) or f"{len(skills)} skills valid")
          sys.exit(bool(errors))
          PY

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # advanced-security: false keeps this job at contents: read; findings fail the
      # run and print in the log instead of uploading SARIF (needs security-events: write).
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: v1.32.0
