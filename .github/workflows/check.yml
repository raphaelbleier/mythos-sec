name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Generated host files are in sync
        run: python3 scripts/build-hosts.py --check

      # build-hosts.py --check only compares what it would generate: a canonical
      # file that was deleted leaves its generated copy behind and the check stays green.
      - name: No orphaned generated files
        run: |
          rc=0
          for f in agents/*.md; do
            [ -e ".opencode/agent/$(basename "$f")" ] || { echo "orphan: $f has no .opencode/agent/$(basename "$f")"; rc=1; }
          done
          for f in commands/*.md; do
            [ -e ".opencode/command/$(basename "$f")" ] || { echo "orphan: $f has no .opencode/command/$(basename "$f")"; rc=1; }
          done
          exit $rc

      # scripts/probe, verify, coverage and mythos have no .py suffix, so a
      # suffix-based glob never syntax-checks them. Select by shebang as well.
      - name: Python files compile
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bad = 0
          for f in subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.splitlines():
              try:
                  src = open(f, "rb").read()
              except OSError:
                  continue
              first = src.split(b"\n", 1)[0]
              if not (f.endswith(".py") or (first.startswith(b"#!") and b"python" in first)):
                  continue
              try:
                  compile(src, f, "exec")
              except SyntaxError as e:
                  print(f"{f}: {e}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: Shell scripts parse
        run: |
          git ls-files '*.sh' | xargs -r -n1 bash -n

      - name: Self-checks
        run: |
          python3 bench/stats.py --selftest
          python3 bench/score.py --selftest
          python3 bench/labs.py selftest
          python3 hooks/scope-guard.py --selftest
          python3 hooks/budget-guard.py --selftest
          python3 scripts/cvefeed --selftest
          python3 scripts/findings --selftest
          python3 scripts/lessons --selftest
          python3 scripts/models --check
          # TODO: scripts/coverage and scripts/verify are gaining --selftest. Once both
          # have landed, drop the grep guards and run them unconditionally.
          for s in scripts/coverage scripts/verify; do
            if grep -q -- '--selftest' "$s"; then python3 "$s" --selftest; else echo "skip $s: no --selftest yet"; fi
          done

      # An invalid plugin manifest is dropped silently by Claude Code and already
      # cost a whole benchmark sweep its scaffolding (docs/poster/LIMITATIONS.md).
      - name: Install YAML parser (hash-pinned)
        run: pip install --require-hashes -r .github/ci-requirements.txt

      - name: Manifests and frontmatter are valid
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          import yaml

          errors = []

          for f in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json",
                    "opencode.json", "hooks/hooks.json"):
              try:
                  d = json.load(open(f, encoding="utf-8"))
              except (OSError, ValueError) as e:
                  errors.append(f"{f}: {e}")
                  continue
              if f.endswith("plugin.json"):
                  # Claude Code rejects string-valued component paths and a string author.
                  bad = [k for k in ("commands", "agents", "skills") if isinstance(d.get(k), str)]
                  if not isinstance(d.get("author", {}), dict):
                      bad.append("author")
                  if bad:
                      errors.append(f"{f}: invalid fields: {', '.join(bad)}")

          def front(p):
              m = re.match(r"---\r?\n(.*?)\r?\n---[ \t]*(\r?\n|$)", p.read_text(encoding="utf-8"), re.S)
              if not m:
                  raise ValueError("no YAML frontmatter")
              d = yaml.safe_load(m.group(1))
              if not isinstance(d, dict):
                  raise ValueError("frontmatter is not a mapping")
              return d

          for p in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              try:
                  d = front(p)
              except Exception as e:
                  errors.append(f"{p}: {e}")
                  continue
              if d.get("name") != p.parent.name:
                  errors.append(f"{p}: name {d.get('name')!r} != directory {p.parent.name!r}")
              if not (isinstance(d.get("description"), str) and d["description"].strip()):
                  errors.append(f"{p}: missing description")

          for p in sorted(pathlib.Path(".opencode/agent").glob("*.md")):
              try:
                  d = front(p)
              except Exception as e:
                  errors.append(f"{p}: {e}")
                  continue
              if not (isinstance(d.get("description"), str) and d["description"].strip()):
                  errors.append(f"{p}: missing description")

          print("\n".join(errors) or "all manifests and frontmatter valid")
          sys.exit(bool(errors))
          PY

      # The runner has no Claude Code CLI; run the schema check wherever one exists.
      - name: claude plugin validate
        run: |
          if command -v claude >/dev/null 2>&1; then claude plugin validate .
          else echo "skip: claude CLI not available"; fi

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # advanced-security: false keeps this job at contents: read; findings fail the
      # run and print in the log instead of uploading SARIF (needs security-events: write).
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: v1.32.0
