# Mythos test lab: deliberately vulnerable targets on an isolated network.
# For LOCAL testing of the framework only. Never expose these ports publicly.
#
#   start:  docker compose -f lab/docker-compose.yml up -d
#   stop:   docker compose -f lab/docker-compose.yml down
#
# Targets:
#   vulnapp    http://localhost:5001   ground-truth app (known findings)
#   juiceshop  http://localhost:3000   OWASP Juice Shop (modern JS web app)
#   dvwa       http://localhost:4280   Damn Vulnerable Web App (classic)
#   vampi      http://localhost:5002   VAmPI (vulnerable REST API)
#   dvga       http://localhost:5013   Damn Vulnerable GraphQL App (hard: GraphQL RCE)
#   vuln-bank-web http://localhost:5003  Vuln Bank (needs VULNBANK_DIR=<checkout>, no default)
#   oast       http://localhost:8081   HTTP+DNS catcher (OAST), log at /__log
#   admin-bot  http://localhost:8000   POST /visit {url} with admin cookie
# Network `mythos-lab` has a fixed name: scripts/mythos net mythos-lab
name: mythos-lab

networks:
  mythos-lab:
    name: mythos-lab
    driver: bridge

# MYTHOS_LAB_BIND is the address the targets publish on. It defaults to
# 127.0.0.1, which is what keeps a deliberately vulnerable application off the
# network. Set it to the docker bridge gateway (`ip -4 addr show docker0`,
# usually 172.17.0.1) only when an arm runs inside its own container and cannot
# reach host loopback: a third-party framework with its own sandbox, for
# example. Never set it to 0.0.0.0, which publishes the vulnerable app to every
# host on your network.
services:
  vulnapp:
    build: ./vulnapp
    container_name: mythos-vulnapp
    ports:
      - "${MYTHOS_LAB_BIND:-127.0.0.1}:5001:5000"
    networks: [mythos-lab]

  juiceshop:
    image: bkimminich/juice-shop:v20.3.0@sha256:cea5a4af4aacee498c491491af0408934ec81d004035c0a02ef3e54395e3bf27
    container_name: mythos-juiceshop
    ports:
      - "${MYTHOS_LAB_BIND:-127.0.0.1}:3000:3000"
    networks: [mythos-lab]

  dvwa:
    image: vulnerables/web-dvwa:latest@sha256:dae203fe11646a86937bf04db0079adef295f426da68a92b40e3b181f337daa7
    container_name: mythos-dvwa
    ports:
      - "${MYTHOS_LAB_BIND:-127.0.0.1}:4280:80"
    networks: [mythos-lab]

  # Lightweight vulnerable REST API (IDOR/BOLA, SQLi, JWT, mass assignment).
  # Stands in for crAPI on memory-constrained hosts (single small container).
  vampi:
    image: erev0s/vampi:latest@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
    container_name: mythos-vampi
    environment:
      - vulnerable=1
    ports:
      - "${MYTHOS_LAB_BIND:-127.0.0.1}:5002:5000"
    networks: [mythos-lab]

  # Damn Vulnerable GraphQL Application — hard class: GraphQL code execution,
  # SSRF->RCE via importPaste, introspection, broken access control.
  dvga:
    image: dolevf/dvga:latest@sha256:040aa33c199d99f3380c9ff9a1ee5d725e9abca7b189c63a35a2a73bda79c957
    container_name: mythos-dvga
    environment:
      - WEB_HOST=0.0.0.0
    ports:
      - "${MYTHOS_LAB_BIND:-127.0.0.1}:5013:5013"
    networks: [mythos-lab]

  # Vuln Bank (Commando-X/vuln-bank): race conditions, GraphQL, BOPLA, stored XSS.
  # Clone it first: git clone https://github.com/Commando-X/vuln-bank "$VULNBANK_DIR"
  # postgres 13 went end-of-life on 2025-11-13; kept because vuln-bank targets it.
  # Loopback-only lab network, no published port.
  vuln-bank-db:
    image: postgres:13@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
    container_name: mythos-vuln-bank-db
    environment:
      - POSTGRES_DB=vulnerable_bank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks: [mythos-lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vulnerable_bank"]
      interval: 5s
      retries: 10

  vuln-bank-web:
    # A required-variable form (${VULNBANK_DIR:?...}) would make every compose command
    # fail, including `up vulnapp`, so an unset variable points at a path whose name
    # is the error message.
    build: ${VULNBANK_DIR:-./VULNBANK_DIR-not-set_clone-Commando-X-vuln-bank-and-export-VULNBANK_DIR}
    container_name: mythos-vuln-bank
    environment:
      - DB_NAME=vulnerable_bank
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=vuln-bank-db
      - DB_PORT=5432
    depends_on:
      vuln-bank-db:
        condition: service_healthy
    ports:
      - "${MYTHOS_LAB_BIND:-127.0.0.1}:5003:5000"
    networks: [mythos-lab]

  # Out-of-band catcher for blind SSRF/XSS/XXE. From the lab: http://oast:8080/x,
  # DNS oast:5353/udp. Internet-free replacement for interactsh.
  oast:
    build: ./oast
    container_name: mythos-oast
    volumes:
      - oast-data:/data
    ports:
      - "${MYTHOS_LAB_BIND:-127.0.0.1}:8081:8080"
    networks: [mythos-lab]

  # Visits URLs as admin to trigger stored XSS. Set ADMIN_COOKIE_VALUE to an
  # admin session token of the target app (ADMIN_COOKIE_NAME defaults to `token`).
  admin-bot:
    build: ./admin-bot
    container_name: mythos-admin-bot
    environment:
      - ADMIN_COOKIE_NAME=${ADMIN_COOKIE_NAME:-token}
      - ADMIN_COOKIE_VALUE=${ADMIN_COOKIE_VALUE:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-vulnapp,juiceshop,dvwa,vampi,dvga,vuln-bank-web}
    ports:
      - "${MYTHOS_LAB_BIND:-127.0.0.1}:8000:8000"
    networks: [mythos-lab]

volumes:
  oast-data:
